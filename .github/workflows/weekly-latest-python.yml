name: Weekly Latest Python

on:
  push: # only for testing, remove before merge!
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-latest-python
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Unittests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.x
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build extension
      run: pip install -e .
    - name: Run unit tests
      run: python -m unittest discover -s tests

  Pylint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.x
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -r requirements.txt
    - name: Build extension
      run: pip install -e .
    - name: Run Pylint
      run: pylint membar/
