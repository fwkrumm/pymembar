name: CI_mymembar

on: [push, pull_request]

# limit GITHUB_TOKEN permissions
permissions:
  contents: read

jobs:
  Build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.8.*, 3.9.*, 3.10.*, 3.11.*, 3.12.*, 3.13.*, 3.x]
    steps:
      - uses: actions/checkout@v4
      - name: Python unit testing
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Visual Studio Build Tools should be available
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel twine cibuildwheel

      - name: Build C extension (common python build)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          python -m build --wheel

      - name: Build C extension (cibuildwheel for Linux)
        if: runner.os == 'Linux'
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: dist
          
      - name: Publish to Test PyPI
        run: |
          twine upload --repository testpypi dist/*.whl --verbose || { echo "::error:: ❌ Error: Upload failed. Possibly because the version already exists."; exit 1; }
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_API_TOKEN_ENV }}
