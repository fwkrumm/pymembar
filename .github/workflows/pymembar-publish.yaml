name: Publish to PyPI

on:
  push:
    branches:
      - master

# limit TOKEN permissions
permissions:
  contents: read

jobs:
  Build:
    environment: python-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Build C extension
        uses: pypa/cibuildwheel@v4.3.4
        with:
          output-dir: dist
        env:
          CIBW_TEST_COMMAND_LINUX: "python -m unittest discover -s {project}/tests -p 'test_*.py' -v"
          CIBW_TEST_COMMAND_MACOS: "python -m unittest discover -s {project}/tests -p 'test_*.py' -v"
          CIBW_TEST_COMMAND_WINDOWS: "python -m unittest discover -s {project}\\tests -p test_*.py -v"

      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist

      - name: Upload wheels
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

      - name: Upload source distribution
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  # Requires admin approval via the "pypi-publish" environment's
  # "pypi-publish" environment's "Required reviewers" protection rule in GitHub repo settings.
  Publish:
    needs: Build
    environment: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          # workaround for bug concerning twine; cf. https://github.com/pypa/twine/issues/1216
          python -m pip install -U packaging
          if ! python -m twine upload dist/*; then
            echo "::error:: Upload failed. Possibly because the version already exists."
            exit 1
          fi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN_ENV }}
