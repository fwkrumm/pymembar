name: CI_pymembar

# TODO change to tag
on: [push]

# limit TOKEN permissions
permissions:
  contents: read

jobs:
  Build:
    environment: python-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Build C extension
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: dist
        env:
          CIBW_TEST_COMMAND_LINUX: "python -m unittest discover -s {project}/tests -p 'test_*.py' -v"
          CIBW_TEST_COMMAND_MACOS: "python -m unittest discover -s {project}/tests -p 'test_*.py' -v"
          CIBW_TEST_COMMAND_WINDOWS: "python -m unittest discover -s {project}\\tests -p test_*.py -v"

      # Only publish to PyPI on pushes to master branch; make sure the version is not already published
      - name: Publish to PyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          # workaround for bug concerning twine; cf. https://github.com/pypa/twine/issues/1216
          python -m pip install -U packaging
          python -m twine upload dist/*.whl --verbose || { echo "::error:: ❌ Error: Upload failed. Possibly because the version already exists."; exit 1; }
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN_ENV }}
