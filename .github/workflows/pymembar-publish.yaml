name: CI_pymembar_release

# TODO change to tag
on: [push, pull_request]

# limit GITHUB_TOKEN permissions
permissions:
  contents: read

jobs:
  Build:
    environment: python-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Python Publishing
        uses: actions/setup-python@v5

      - name: Build C extension
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: dist
        env:
          CIBW_TEST_COMMAND: "ls -lah && cd tests && python -m unittest discover -v"

      - name: Publish to Test PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          python -m pip install -U packaging
          python -m twine upload --repository testpypi dist/*.whl --verbose || { echo "::error:: ❌ Error: Upload failed. Possibly because the version already exists."; exit 1; }
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_API_TOKEN_ENV }}
