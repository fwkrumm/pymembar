name: CI_pymembar

# TODO change to tag
on: [push, pull_request]

# limit TOKEN permissions
permissions:
  contents: read

jobs:
  Build:
    environment: python-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Build C extension
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: dist
        env:
          CIBW_TEST_COMMAND_LINUX: "python -m unittest discover -s {project}/tests -p 'test_*.py' -v"
          CIBW_TEST_COMMAND_MACOS: "python -m unittest discover -s {project}/tests -p 'test_*.py' -v"
          CIBW_TEST_COMMAND_WINDOWS: "python -m unittest discover -s {project}\\tests -p test_*.py -v"

      - name: Upload wheels
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # Only publish to PyPI on pushes to master branch; requires admin approval via the
  # "pypi-publish" environment's "Required reviewers" protection rule in GitHub repo settings.
  Publish:
    needs: Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: pypi-publish
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          # workaround for bug concerning twine; cf. https://github.com/pypa/twine/issues/1216
          python -m pip install -U packaging
          python -m twine upload dist/*.whl --verbose || { echo "::error:: ❌ Error: Upload failed. Possibly because the version already exists."; exit 1; }
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN_ENV }}
